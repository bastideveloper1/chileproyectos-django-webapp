{% extends 'base/base_registration.html' %} 
{% load static %} 
{% block content%}

<!-- Sección Login -->
<section class="section login-section">
  <div class="container">
    <h2 class="title has-text-centered is-3 has-text-grey-dark">
      Iniciar sesión
    </h2>
    <div class="login-box box">
      <form id="fake-login-form">
        <!-- Correo -->
        <div class="field">
          <label class="label">Correo electrónico</label>
          <div class="control has-icons-left">
            <input
              class="input"
              type="email"
              id="correo"
              placeholder="Correo electrónico"
            />
            <span class="icon is-small is-left">
              <i class="fas fa-envelope"></i>
            </span>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field">
          <label class="label">Contraseña</label>
          <div class="control has-icons-left">
            <input
              class="input"
              type="password"
              id="contrasena"
              placeholder="Contraseña"
            />
            <span class="icon is-small is-left">
              <i class="fas fa-lock"></i>
            </span>
            <button
              type="button"
              class="toggle-password-button"
              onclick="togglePassword()"
            >
              <i class="fas fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Botón -->
        <div class="field">
          <button class="button is-link is-fullwidth" type="submit">
            Iniciar sesión
          </button>
        </div>

        <!-- Recuperar contraseña -->
        <div class="has-text-centered mt-3">
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById("contrasena");
    const icon = document.getElementById("eye-icon");
    const isPassword = passwordInput.type === "password";

    passwordInput.type = isPassword ? "text" : "password";
    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
  }

  document
    .getElementById("fake-login-form")
    .addEventListener("submit", function (event) {
      event.preventDefault();

      const correo = document.getElementById("correo").value.trim();
      const contrasena = document.getElementById("contrasena").value.trim();

      if (correo === "empresa@gmail.com" && contrasena === "123456") {
        window.location.href = "/mis-proyectos";
      } else if (correo === "cliente@gmail.com" && contrasena === "123456") {
        window.location.href = "/mis_proyectos_cliente";
      } else {
        alert("Correo o contraseña incorrecta");
      }
    });
</script>

{% endblock %}
